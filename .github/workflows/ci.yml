name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/checkout@v7
        with:
          repository: agent-ix/spec-artifacts-iso
          path: .deps/spec-artifacts-iso
      - uses: actions/checkout@v7
        with:
          repository: agent-ix/ix-flow
          path: .deps/ix-flow
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v6
        with:
          version: "10.33.4"
      - name: Install Rust toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.8
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
      - run: python -m pip install -e '.[dev]'
      - run: npm install --global '@agent-ix/quire-cli@0.33.0'
      - run: pnpm --dir .deps/ix-flow install --frozen-lockfile
      - run: pnpm --dir .deps/ix-flow build
      - run: make lint
      - run: make test
        env:
          REQUIRE_QUIRE: "1"
          REQUIRE_IX_FLOW: "1"
          IX_FLOW_BIN: ${{ github.workspace }}/.deps/ix-flow/bin/ix-flow.js
          MODULE_MANIFEST_SCHEMA: ${{ github.workspace }}/.deps/spec-artifacts-iso/spec_artifacts_iso/module-manifest.schema.json
      - run: make package-audit
      - run: make rust-foundation-gate
