name: Release attestation

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install the repository Rust toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build the Engineering Assurance CLI
        shell: bash
        run: cargo build --locked --no-default-features --features full --release --bin engineering-assurance
      - name: Stage release artifact
        shell: bash
        run: |
          mkdir -p release-artifacts
          cp target/release/engineering-assurance release-artifacts/engineering-assurance
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 7

  attest:
    needs: build
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: agent-ix/engineering-assurance/.github/workflows/release-attestation.yml@v0.9.0
    with:
      tag: ${{ github.ref_name }}
      ea_tooling_tag: v0.9.0
      record_path: spec/releases/engineering-assurance.md
      allowed_signers_path: .engineering-assurance/allowed_signers
