name: Release attestation

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      ea_tooling_tag:
        required: true
        type: string
      quoin_tooling_tag:
        required: true
        type: string
      record_path:
        required: true
        type: string
      allowed_signers_path:
        required: true
        type: string
      approval_signer_repository:
        required: true
        type: string
      approval_signer_workflow_path:
        required: true
        type: string
      approval_signer_ref:
        required: true
        type: string
      record_publisher_repository:
        required: true
        type: string
      record_publisher_workflow_path:
        required: true
        type: string
      record_publisher_ref:
        required: true
        type: string
      transparency:
        required: true
        type: string
      artifact_name:
        required: false
        type: string
        default: release-artifacts
      evidence_artifact:
        required: false
        type: string
        default: release-evidence

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      attestation_inputs_artifact: ${{ steps.attestation-artifact-name.outputs.name }}
    steps:
      - name: Generate an unpredictable handoff artifact name
        id: attestation-artifact-name
        shell: bash
        run: |
          set -euo pipefail
          printf 'name=verified-release-inputs-%s\n' "$(python3 -c 'import secrets; print(secrets.token_hex(32))')" >> "$GITHUB_OUTPUT"

      - name: Check the triggering release tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "push" || "$REF_TYPE" != "tag" || "$INPUT_TAG" != "$REF_NAME" ]]; then
            echo "::error::release_input_tag_mismatch"
            exit 1
          fi

      - name: Check out the triggering tag as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Check out protected base branch policy as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: protected-base
          persist-credentials: false

      - name: Download the release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.artifact_name }}
          path: release-artifacts

      - name: Download retained evidence when present
        id: retained-evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: ${{ inputs.evidence_artifact }}
          path: release-evidence

      - name: Refuse when no retained release evidence store exists
        if: steps.retained-evidence.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::no_retained_evidence_store"
          exit 1

      - name: Refuse an empty retained release evidence artifact
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d release-evidence ]] || ! find release-evidence -type f -print -quit | grep -q .; then
            echo "::error::no_retained_evidence_store"
            exit 1
          fi

      - name: Download trusted Engineering Assurance tooling
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EA_TOOLING_TAG: ${{ inputs.ea_tooling_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$EA_TOOLING_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::ea_tooling_tag_invalid"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/ea-tooling"
          gh release download "$EA_TOOLING_TAG" \
            --repo agent-ix/engineering-assurance \
            --pattern engineering-assurance \
            --dir "$RUNNER_TEMP/ea-tooling"
          chmod 0755 "$RUNNER_TEMP/ea-tooling/engineering-assurance"

      - name: Verify the signed release tag against protected policy
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RECORD_PATH: ${{ inputs.record_path }}
          ALLOWED_SIGNERS_PATH: ${{ inputs.allowed_signers_path }}
        run: |
          set -euo pipefail
          case "$ALLOWED_SIGNERS_PATH" in
            ""|/*|-*|../*|*/../*|*/..|*\\*)
              echo "::error::release_allowed_signers_path_invalid"
              exit 1
              ;;
          esac
          allowed_signers="$RUNNER_TEMP/protected-allowed-signers"
          git -C protected-base show "HEAD:$ALLOWED_SIGNERS_PATH" > "$allowed_signers"
          request="$(jq -n \
            --arg tag "$INPUT_TAG" \
            --arg repository "$GITHUB_WORKSPACE/source" \
            --arg record_path "$RECORD_PATH" \
            --arg allowed_signers "$allowed_signers" \
            '{protocol:"engineering-assurance.release-verify-request/v1",repository:$repository,tag:$tag,record_path:$record_path,allowed_signers:$allowed_signers}')"
          result="$("$RUNNER_TEMP/ea-tooling/engineering-assurance" release-verify --request "$request")"
          status="$(jq -r '.status // "unknown"' <<<"$result")"
          if [[ "$status" != "released" ]]; then
            echo "::error::release_verify_status=$status"
            exit 1
          fi

      - name: Prepare an isolated Quoin tool directory
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/quoin-tooling"

      - name: Install the exact published Quoin exporter
        working-directory: ${{ runner.temp }}/quoin-tooling
        shell: bash
        env:
          NPMJS_REGISTRY: "\u0068ttps:\u002f\u002fregistry.npmjs.org"
          NPM_CONFIG_USERCONFIG: /dev/null
          QUOIN_TOOLING_TAG: ${{ inputs.quoin_tooling_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$QUOIN_TOOLING_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::quoin_tooling_tag_invalid"
            exit 1
          fi
          npm install --ignore-scripts --registry="$NPMJS_REGISTRY" "@agent-ix/quoin@$QUOIN_TOOLING_TAG"

      - name: Validate the retained evidence store with the Quoin exporter
        shell: bash
        env:
          QUOIN_CLI: ${{ runner.temp }}/quoin-tooling/node_modules/.bin/quoin
          RELEASE_ARTIFACTS_DIR: release-artifacts
          EVIDENCE_DIR: release-evidence
          EXECUTION_PROVENANCE: release-evidence/execution-provenance.dsse.json
          TEST_RESULT_OUTPUT: ${{ runner.temp }}/test-result.json
          EA_TOOL: ${{ runner.temp }}/ea-tooling/engineering-assurance
          EA_TOOLING_TAG: ${{ inputs.ea_tooling_tag }}
          INPUT_TAG: ${{ inputs.tag }}
          RECORD_PATH: ${{ inputs.record_path }}
          ALLOWED_SIGNERS_PATH: ${{ inputs.allowed_signers_path }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          APPROVAL_SIGNER_REPOSITORY: ${{ inputs.approval_signer_repository }}
          APPROVAL_SIGNER_WORKFLOW_PATH: ${{ inputs.approval_signer_workflow_path }}
          APPROVAL_SIGNER_REF: ${{ inputs.approval_signer_ref }}
          RECORD_PUBLISHER_REPOSITORY: ${{ inputs.record_publisher_repository }}
          RECORD_PUBLISHER_WORKFLOW_PATH: ${{ inputs.record_publisher_workflow_path }}
          RECORD_PUBLISHER_REF: ${{ inputs.record_publisher_ref }}
          TRANSPARENCY: ${{ inputs.transparency }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          subject_path="$RUNNER_TEMP/release-artifact-subject.json"
          python3 - "$subject_path" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          root = Path(os.environ["RELEASE_ARTIFACTS_DIR"])
          subjects = []
          for path in sorted(root.rglob("*")):
              if path.is_symlink():
                  raise SystemExit("release_artifact_subject_invalid")
              if not path.is_file():
                  continue
              digest = hashlib.sha256()
              with path.open("rb") as artifact:
                  for chunk in iter(lambda: artifact.read(1024 * 1024), b""):
                      digest.update(chunk)
              subjects.append({
                  "name": path.relative_to(root).as_posix(),
                  "digest": {"sha256": digest.hexdigest()},
              })
          if not subjects:
              raise SystemExit("release_artifact_subject_invalid")
          Path(sys.argv[1]).write_text(
              json.dumps(subjects, separators=(",", ":")), encoding="utf-8"
          )
          PY

          gh auth setup-git
          request="$(jq -n \
            --arg repository "$GITHUB_WORKSPACE/source" \
            --arg github_repository "$GITHUB_REPOSITORY" \
            --arg tag "$INPUT_TAG" \
            --arg record_path "$RECORD_PATH" \
            --arg allowed_signers_path "$ALLOWED_SIGNERS_PATH" \
            --arg base_branch "$BASE_BRANCH" \
            --arg signer_repository "agent-ix/engineering-assurance" \
            --arg signer_workflow_path ".github/workflows/release-attestation.yml" \
            --arg signer_ref "refs/tags/$EA_TOOLING_TAG" \
            --arg approval_signer_repository "$APPROVAL_SIGNER_REPOSITORY" \
            --arg approval_signer_workflow_path "$APPROVAL_SIGNER_WORKFLOW_PATH" \
            --arg approval_signer_ref "$APPROVAL_SIGNER_REF" \
            --arg record_publisher_repository "$RECORD_PUBLISHER_REPOSITORY" \
            --arg record_publisher_workflow_path "$RECORD_PUBLISHER_WORKFLOW_PATH" \
            --arg record_publisher_ref "$RECORD_PUBLISHER_REF" \
            --arg transparency "$TRANSPARENCY" \
            --arg release_artifacts "$GITHUB_WORKSPACE/release-artifacts" \
            --arg execution_provenance_bundle "$GITHUB_WORKSPACE/$EXECUTION_PROVENANCE" \
            '{protocol:"engineering-assurance.release-roles-verify-request/v1", repository:$repository, github_repository:$github_repository, tag:$tag, record_path:$record_path, allowed_signers_path:$allowed_signers_path, base_branch:$base_branch, signer_repository:$signer_repository, signer_workflow_path:$signer_workflow_path, signer_ref:$signer_ref, approval_signer_repository:$approval_signer_repository, approval_signer_workflow_path:$approval_signer_workflow_path, approval_signer_ref:$approval_signer_ref, record_publisher_repository:$record_publisher_repository, record_publisher_workflow_path:$record_publisher_workflow_path, record_publisher_ref:$record_publisher_ref, transparency:$transparency, release_artifacts:$release_artifacts, execution_provenance_bundle:$execution_provenance_bundle}')"
          result="$("$EA_TOOL" release-roles-verify --request "$request")"
          status="$(jq -r '.status // "unknown"' <<<"$result")"
          if [[ "$status" != "satisfied" ]]; then
            echo "::error::release_roles_status=$status"
            exit 1
          fi

          error_path="$RUNNER_TEMP/quoin-test-result.stderr"
          if "$QUOIN_CLI" evidence export-test-result \
            --subject "$subject_path" \
            --execution-provenance "$EXECUTION_PROVENANCE" \
            --output "$TEST_RESULT_OUTPUT" \
            --evidence-dir "$EVIDENCE_DIR" \
            > "$RUNNER_TEMP/quoin-test-result.stdout" 2> "$error_path"; then
            :
          else
            quoin_status=$?
            if grep -Fq 'evidence_store_invalid' "$error_path"; then
              echo "::error::no_retained_evidence_store"
              exit 1
            fi
            cat "$error_path" >&2
            exit "$quoin_status"
          fi

          if ! python3 - "$TEST_RESULT_OUTPUT" "$subject_path" <<'PY'
          import json
          import sys
          from pathlib import Path

          try:
              result = json.loads(Path(sys.argv[1]).read_bytes())
              expected_subject = json.loads(Path(sys.argv[2]).read_bytes())
          except (OSError, UnicodeDecodeError, json.JSONDecodeError):
              raise SystemExit(1)

          statement_type = "https:" + "//in-toto.io/Statement/v1"
          predicate_type = "https:" + "//in-toto.io/attestation/test-result/v0.1"
          valid = (
              isinstance(result, dict)
              and result.get("_type") == statement_type
              and result.get("predicateType") == predicate_type
              and result.get("subject") == expected_subject
              and isinstance(result.get("predicate"), dict)
          )
          raise SystemExit(0 if valid else 1)
          PY
          then
            echo "::error::test_result_export_invalid"
            exit 1
          fi

          mkdir -p attestation-inputs
          cp -- "$TEST_RESULT_OUTPUT" attestation-inputs/test-result.json

      - name: Verify signed release and retained approval roles
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EA_TOOL: ${{ runner.temp }}/ea-tooling/engineering-assurance
          EA_TOOLING_TAG: ${{ inputs.ea_tooling_tag }}
          INPUT_TAG: ${{ inputs.tag }}
          RECORD_PATH: ${{ inputs.record_path }}
          ALLOWED_SIGNERS_PATH: ${{ inputs.allowed_signers_path }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          APPROVAL_SIGNER_REPOSITORY: ${{ inputs.approval_signer_repository }}
          APPROVAL_SIGNER_WORKFLOW_PATH: ${{ inputs.approval_signer_workflow_path }}
          APPROVAL_SIGNER_REF: ${{ inputs.approval_signer_ref }}
          RECORD_PUBLISHER_REPOSITORY: ${{ inputs.record_publisher_repository }}
          RECORD_PUBLISHER_WORKFLOW_PATH: ${{ inputs.record_publisher_workflow_path }}
          RECORD_PUBLISHER_REF: ${{ inputs.record_publisher_ref }}
          TRANSPARENCY: ${{ inputs.transparency }}
        run: |
          set -euo pipefail
          gh auth setup-git
          request="$(jq -n \
            --arg repository "$GITHUB_WORKSPACE/source" \
            --arg github_repository "$GITHUB_REPOSITORY" \
            --arg tag "$INPUT_TAG" \
            --arg record_path "$RECORD_PATH" \
            --arg allowed_signers_path "$ALLOWED_SIGNERS_PATH" \
            --arg base_branch "$BASE_BRANCH" \
            --arg signer_repository "agent-ix/engineering-assurance" \
            --arg signer_workflow_path ".github/workflows/release-attestation.yml" \
            --arg signer_ref "refs/tags/$EA_TOOLING_TAG" \
            --arg approval_signer_repository "$APPROVAL_SIGNER_REPOSITORY" \
            --arg approval_signer_workflow_path "$APPROVAL_SIGNER_WORKFLOW_PATH" \
            --arg approval_signer_ref "$APPROVAL_SIGNER_REF" \
            --arg record_publisher_repository "$RECORD_PUBLISHER_REPOSITORY" \
            --arg record_publisher_workflow_path "$RECORD_PUBLISHER_WORKFLOW_PATH" \
            --arg record_publisher_ref "$RECORD_PUBLISHER_REF" \
            --arg transparency "$TRANSPARENCY" \
            --arg release_artifacts "$GITHUB_WORKSPACE/release-artifacts" \
            --arg execution_provenance_bundle "$GITHUB_WORKSPACE/$EXECUTION_PROVENANCE" \
            '{protocol:"engineering-assurance.release-roles-verify-request/v1", repository:$repository, github_repository:$github_repository, tag:$tag, record_path:$record_path, allowed_signers_path:$allowed_signers_path, base_branch:$base_branch, signer_repository:$signer_repository, signer_workflow_path:$signer_workflow_path, signer_ref:$signer_ref, approval_signer_repository:$approval_signer_repository, approval_signer_workflow_path:$approval_signer_workflow_path, approval_signer_ref:$approval_signer_ref, record_publisher_repository:$record_publisher_repository, record_publisher_workflow_path:$record_publisher_workflow_path, record_publisher_ref:$record_publisher_ref, transparency:$transparency, release_artifacts:$release_artifacts, execution_provenance_bundle:$execution_provenance_bundle}')"
          result="$("$EA_TOOL" release-roles-verify --request "$request")"
          status="$(jq -r '.status // "unknown"' <<<"$result")"
          if [[ "$status" != "satisfied" ]]; then
            echo "::error::release_roles_status=$status"
            exit 1
          fi

      - name: Upload verified attestation inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.attestation-artifact-name.outputs.name }}
          path: attestation-inputs/
          if-no-files-found: error

  attest:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.artifact_name }}
          path: release-artifacts

      - name: Download verified attestation inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.verify.outputs.attestation_inputs_artifact }}
          path: attestation-inputs

      - name: Attest SLSA provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-artifacts/**
          predicate-type: "\u0068ttps:\u002f\u002fslsa.dev/provenance/v1"
          predicate-path: attestation-inputs/provenance.json
          create-storage-record: false

      - name: Attest CycloneDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-artifacts/**
          sbom-path: attestation-inputs/sbom.cdx.json
          create-storage-record: false

      - name: Attest Quoin test result
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-artifacts/**
          predicate-type: "\u0068ttps:\u002f\u002fin-toto.io/attestation/test-result/v0.1"
          predicate-path: attestation-inputs/test-result.json
          create-storage-record: false

      - name: Attest release verification summary
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-artifacts/**
          predicate-type: "\u0068ttps:\u002f\u002fslsa.dev/verification_summary/v1"
          predicate-path: attestation-inputs/verification-summary.json
          create-storage-record: false
