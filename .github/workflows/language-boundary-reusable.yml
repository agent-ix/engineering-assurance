name: Reusable language boundary

on:
  workflow_call:
    inputs:
      repository:
        description: Base repository (owner/name), never the PR head repository
        required: true
        type: string
      pull_number:
        description: Pull request number in the base repository
        required: true
        type: number
      base_sha:
        description: Trusted pull request base commit
        required: true
        type: string
      head_sha:
        description: Pull request head commit to inspect as inert Git data
        required: true
        type: string

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate trusted repository and revision inputs
        shell: bash
        env:
          REPOSITORY: ${{ inputs.repository }}
          CALLER_REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PR_NUMBER: ${{ inputs.pull_number }}
        run: |
          [[ "$REPOSITORY" == "$CALLER_REPOSITORY" ]]
          [[ "$REPOSITORY" =~ ^agent-ix/[A-Za-z0-9-]+$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
      - name: Check out checker at its own trusted workflow revision
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: checker
          submodules: recursive
          persist-credentials: false
      - name: Check out base as inert data
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.base_sha }}
          path: baseline
          fetch-depth: 0
          persist-credentials: false
      - name: Check out PR head as inert data
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: refs/pull/${{ inputs.pull_number }}/head
          path: candidate
          fetch-depth: 0
          persist-credentials: false
          # Candidate bytes are inspected by the trusted checker; never executed.
          allow-unsafe-pr-checkout: true
      - name: Verify exact PR head and import base history
        shell: bash
        working-directory: candidate
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          [[ "$(git rev-parse HEAD)" == "$HEAD_SHA" ]]
          git fetch --no-tags ../baseline "$BASE_SHA"
          git cat-file -e "${BASE_SHA}^{commit}"
      - name: Install Rust 1.98.1
        shell: bash
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Reject new non-Rust execution
        shell: bash
        working-directory: checker
        env:
          REPOSITORY: ${{ inputs.repository }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          CARGO_BUILD_JOBS=2 cargo +1.98.1 run --locked --quiet --features full -- \
            language-boundary --root ../candidate \
            --repository "${REPOSITORY#*/}" \
            --base-revision "$BASE_SHA" --head-revision "$HEAD_SHA"
