[features]
# EMPTY ON PURPOSE (EA-17). Cargo unifies features across a whole build, so a
# default that reached `serde_json/arbitrary_precision` would switch it on for
# every crate in a consumer's workspace, and non-JSON serializers (yaml, toml,
# ciborium) would then write a private marker map for a `serde_json::Value`
# number. Enable the capability you need (`features = ["source-audit"]`); the
# `engineering-assurance` binary requires `full`. Do not add a member here
# without re-reading `exact-numbers` below. `cargo test` under an empty default
# builds only the test targets that need no capability; the rest declare
# `required-features`.
default = []
# `content-digest` is the one evidence-byte identity (`ContentDigest`); every
# capability that hashes retained bytes implies it rather than carrying its own
# `sha2` use.
content-digest = ["dep:serde", "dep:sha2", "dep:thiserror"]
producer-execution = [
  "content-digest",
  "dep:rustix",
  "dep:serde",
  "dep:serde_json",
  "dep:serde_json_canonicalizer",
  "dep:thiserror",
]
# `source_audit` (the syn-based "is this library half I/O-free" check) needs
# no domain module full-only implies, so a consumer that wants only the
# audit should not have to accept `serde_json/arbitrary_precision` -- a
# global, workspace-wide change to serde_json's number representation --
# just to reach it. Same shape as `producer-execution` above, one feature
# below the modules it enables, gated in `lib.rs` on this name rather than
# `full`.
source-audit = [
  "dep:serde",
  "dep:syn",
  "dep:thiserror",
]
# `measurement` (FR-020/FR-021's MeasurementPlan objective, estimator and
# decision-rule types and the definition-change check) is the same shape as
# `source-audit` above: a consumer such as Quoin's measurement intake needs
# only these types, and must not inherit `serde_json/arbitrary_precision` from
# `full` to get them.
measurement = [
  "dep:serde",
  "dep:thiserror",
]
campaign = [
  "measurement",
  "producer-execution",
  "dep:agent-ix-engineering-assurance-campaign",
  "dep:sha1",
  "dep:sha2",
]
# `claim_strength` is the FR-022 claim-strength vocabulary. It needs only
# serde, so a consumer that records a strength (Quire, Quoin) must not have to
# accept `full` and its `serde_json/arbitrary_precision` flip to reach it. Same
# shape as `source-audit` above.
claim-strength = [
  "dep:serde",
]
# The remaining library modules, one capability feature each. Each feature
# names the optional dependencies its module actually compiles against (driven
# by `cargo check --lib --no-default-features --features <f>` alone; the
# `make rust-features` matrix re-checks that) and any other capability whose
# module it imports. Only `evidence`, `semantics` (and so `evaluation` and
# `evaluation-reports`), `exact-numbers` and `full` turn on
# `serde_json/arbitrary_precision`, through `exact-numbers`.
compatibility = ["dep:serde", "dep:serde_json", "dep:thiserror"]
compatibility-corpus = ["content-digest", "dep:serde", "dep:serde_json", "dep:thiserror"]
content-rights = [
  "dep:regex",
  "dep:serde",
  "dep:serde_json",
  "dep:thiserror",
  "dep:unicode-casefold",
]
discovery = ["workflow", "dep:serde", "dep:serde_json", "dep:thiserror"]
evaluation = [
  "evidence",
  "workflow",
  "dep:serde",
  "dep:serde_json",
  "dep:thiserror",
  "dep:time",
]
evaluation-reports = [
  "evaluation",
  "evidence",
  "workflow",
  "dep:serde",
  "dep:serde_json",
  "dep:thiserror",
]
# `evidence` and `semantics` (and so `evaluation`, `evaluation-reports`) hash
# and compare numbers that only stay exact with `serde_json/arbitrary_precision`
# (integers beyond u64, refusal of `1e309`); measured by running
# `evidence_parity` and `semantics_parity` with and without it.
evidence = [
  "content-digest",
  "exact-numbers",
  "dep:serde",
  "dep:serde_json",
  "dep:thiserror",
]
manifest = [
  "structured-yaml",
  "dep:jsonschema",
  "dep:serde",
  "dep:serde_json",
  "dep:thiserror",
]
onboarding = [
  "dep:serde",
  "dep:serde_json",
  "dep:thiserror",
  "dep:yaml_serde",
]
package-audit = ["dep:serde", "dep:serde_json", "dep:thiserror"]
package-lifecycle = ["dep:serde", "dep:serde_json", "dep:thiserror"]
package-membership = ["dep:serde", "dep:thiserror"]
semantics = [
  "claim-strength",
  "compatibility-corpus",
  "content-digest",
  "exact-numbers",
  "dep:serde",
  "dep:serde_json",
  "dep:thiserror",
]
structured-yaml = ["dep:serde_json", "dep:yaml_serde"]
workflow = ["dep:serde", "dep:serde_json", "dep:thiserror"]
workflow-invariants = [
  "dep:serde",
  "dep:serde_json",
  "dep:thiserror",
  "dep:time",
]
# Opt-in, and never part of `default`: turns on `serde_json/arbitrary_precision`. Cargo unifies features
# across the whole dependency graph, so enabling this in one crate changes
# serde_json's number representation for every crate in the same build (it is
# workspace-global, not local to this package), and it changes how a
# `serde_json::Value` bridges to non-JSON serializers (yaml, toml, ciborium).
# Capabilities whose code depends on exact numbers enable it themselves.
exact-numbers = ["serde_json/arbitrary_precision"]
# `full` is every capability plus what only the `engineering-assurance` binary
# and its `*_host` modules use (clap, cap-std, tar, zip, flate2, tempfile),
# plus `exact-numbers`.
full = [
  "campaign",
  "claim-strength",
  "compatibility",
  "compatibility-corpus",
  "content-digest",
  "content-rights",
  "discovery",
  "evaluation",
  "evaluation-reports",
  "evidence",
  "manifest",
  "measurement",
  "onboarding",
  "package-audit",
  "package-lifecycle",
  "package-membership",
  "producer-execution",
  "semantics",
  "source-audit",
  "structured-yaml",
  "workflow",
  "workflow-invariants",
  "exact-numbers",
  "dep:cap-std",
  "dep:clap",
  "dep:flate2",
  "dep:tar",
  "dep:tempfile",
  "dep:zip",
]

[dependencies]
agent-ix-engineering-assurance-campaign = { version = "0.0.0", path = "campaign/generated/rust", optional = true }
sha1 = { version = "0.10", default-features = false, optional = true }
cap-std = { version = "4", optional = true }
clap = { version = "4.5", default-features = false, features = ["error-context", "help", "std", "usage"], optional = true }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"], optional = true }
jsonschema = { version = "0.56", default-features = false, optional = true }
regex = { version = "1.13", optional = true }
rustix = { version = "1.1", features = ["fs", "process"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
serde_json_canonicalizer = { version = "0.3", optional = true }
sha2 = { version = "0.11", default-features = false, optional = true }
syn = { version = "3.0", features = ["full", "visit"], optional = true }
tar = { version = "0.4", default-features = false, optional = true }
tempfile = { version = "3.27", optional = true }
thiserror = { version = "2.0", optional = true }
time = { version = "0.3", features = ["formatting", "parsing"], optional = true }
unicode-casefold = { version = "0.2", optional = true }
yaml_serde = { version = "0.10", optional = true }
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"], optional = true }

[dev-dependencies]
# Public since 2026-09-20 (PLAT-853); pinned to the same rev the vendored
# copy carried, matching the other Agent-IX repos that consume it.
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", rev = "2ce4ebf47f726b9d76388220545cd0abda8a5cfb", version = "=0.1.0" }
tempfile = "3.27"
# The `compatibility` unit tests use these; the feature itself does not.
time = { version = "0.3", features = ["formatting", "parsing"] }
unicode-casefold = "0.2"

[workspace]
resolver = "2"
exclude = ["campaign/generated/rust"]

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[lints]
workspace = true

[profile.release]
codegen-units = 1
lto = "thin"

