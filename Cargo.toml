# feature provides), so each declares them; `cargo test --all-features` runs
# every target. `full` is used where a test runs the binary (which requires
# `full`) or spans several capabilities and dev crates. Unlisted targets are
# still auto-discovered; `default_features` needs no feature and is not listed.

