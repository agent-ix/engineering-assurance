[package]
name = "engineering-assurance"
version = "0.3.1"
edition = "2024"
rust-version = "1.98.1"
license = "AGPL-3.0-or-later"
description = "Rust domain library and CLI for Engineering Assurance"
publish = false
default-run = "engineering-assurance"

[lib]
name = "engineering_assurance"
path = "src/lib.rs"

[[bin]]
name = "engineering-assurance"
path = "src/main.rs"
required-features = ["full"]

[[bin]]
name = "producer-execution-fixture"
path = "tests/fixtures/producer_execution_fixture.rs"
test = false
doc = false
required-features = ["producer-execution"]

[features]
default = ["full"]
producer-execution = [
  "dep:rustix",
  "dep:serde",
  "dep:serde_json",
  "dep:serde_json_canonicalizer",
  "dep:sha2",
  "dep:tempfile",
  "dep:thiserror",
]
# `source_audit` (the syn-based "is this library half I/O-free" check) needs
# no domain module full-only implies, so a consumer that wants only the
# audit should not have to accept `serde_json/arbitrary_precision` -- a
# global, workspace-wide change to serde_json's number representation --
# just to reach it. Same shape as `producer-execution` above, one feature
# below the modules it enables, gated in `lib.rs` on this name rather than
# `full`.
source-audit = [
  "dep:serde",
  "dep:syn",
  "dep:thiserror",
]
full = [
  "producer-execution",
  "source-audit",
  "serde_json/arbitrary_precision",
  "dep:cap-std",
  "dep:clap",
  "dep:flate2",
  "dep:jsonschema",
  "dep:regex",
  "dep:tar",
  "dep:time",
  "dep:unicode-casefold",
  "dep:yaml_serde",
  "dep:zip",
]

[dependencies]
cap-std = { version = "4", optional = true }
clap = { version = "4.5", default-features = false, features = ["error-context", "help", "std", "usage"], optional = true }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"], optional = true }
jsonschema = { version = "0.56", default-features = false, optional = true }
regex = { version = "1.13", optional = true }
rustix = { version = "1.1", features = ["fs", "process"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
serde_json_canonicalizer = { version = "0.3", optional = true }
sha2 = { version = "0.11", default-features = false, optional = true }
syn = { version = "3.0", features = ["full", "visit"], optional = true }
tar = { version = "0.4", default-features = false, optional = true }
tempfile = { version = "3.27", optional = true }
thiserror = { version = "2.0", optional = true }
time = { version = "0.3", features = ["formatting", "parsing"], optional = true }
unicode-casefold = { version = "0.2", optional = true }
yaml_serde = { version = "0.10", optional = true }
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"], optional = true }

[dev-dependencies]
# Public since 2026-09-20 (PLAT-853); pinned to the same rev the vendored
# copy carried, matching the other Agent-IX repos that consume it.
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", rev = "2ce4ebf47f726b9d76388220545cd0abda8a5cfb", version = "=0.1.0" }

[workspace]
resolver = "2"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[lints]
workspace = true

[profile.release]
codegen-units = 1
lto = "thin"
