[package]
name = "engineering-assurance"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "AGPL-3.0-or-later"
description = "Rust domain library and CLI for Engineering Assurance"
publish = false

[lib]
name = "engineering_assurance"
path = "src/lib.rs"

[[bin]]
name = "engineering-assurance"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.5.47", default-features = false, features = ["error-context", "help", "std", "usage"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.11.0", default-features = false }
thiserror = "=2.0.20"

[dev-dependencies]
ix-trace-rs = { path = "vendor/ix-trace-rs", version = "=0.1.0" }

[workspace]
exclude = ["vendor/ix-trace-rs"]
resolver = "2"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[lints]
workspace = true

[profile.release]
codegen-units = 1
lto = "thin"
