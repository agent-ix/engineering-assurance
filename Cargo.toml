[package]
name = "engineering-assurance"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "AGPL-3.0-or-later"
description = "Rust domain library and CLI for Engineering Assurance"
publish = false

[lib]
name = "engineering_assurance"
path = "src/lib.rs"

[[bin]]
name = "engineering-assurance"
path = "src/main.rs"

[dependencies]
cap-std = "=4.0.3"
clap = { version = "=4.5.47", default-features = false, features = ["error-context", "help", "std", "usage"] }
jsonschema = { version = "=0.56.0", default-features = false }
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
sha2 = { version = "=0.11.0", default-features = false }
thiserror = "=2.0.20"
time = { version = "=0.3.55", features = ["parsing"] }
unicode-casefold = "=0.2.0"
yaml_serde = "=0.10.7"

[dev-dependencies]
ix-trace-rs = { path = "vendor/ix-trace-rs", version = "=0.1.0" }

[workspace]
exclude = ["vendor/ix-trace-rs"]
resolver = "2"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[lints]
workspace = true

[profile.release]
codegen-units = 1
lto = "thin"
