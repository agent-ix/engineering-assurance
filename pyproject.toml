[build-system]
requires = ["setuptools>=59.6"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
target-version = "py312"
# `corpus/` is the pinned qa-corpus submodule: another repository's tree, read
# in place, whose Python fixtures are deliberately broken (an undefined name IS
# the defect a case banks). Linting it would make this repository's gate depend
# on that repository's house style and on its fixtures being valid Python,
# which they are not allowed to be.
extend-exclude = ["corpus"]

[tool.pytest.ini_options]
# Collect only this repository's tests. `corpus/` is the pinned qa-corpus
# submodule: mini-repositories that are DATA, run by quire and quoin, never by
# pytest. Its Python fixtures are named `test_*.py` because that is what a
# Python evidence file is called and a fixture has to look like the thing it
# stands for — so pytest imported them and failed on the undefined names that
# are the very defects those cases bank.
testpaths = ["tests"]
norecursedirs = ["corpus", ".git", "build", "dist"]
