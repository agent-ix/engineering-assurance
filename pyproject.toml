[build-system]
requires = ["setuptools>=59.6"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
target-version = "py312"
# `corpus/` is the pinned qa-corpus submodule: another repository's tree, read
# in place, whose Python fixtures are deliberately broken (an undefined name IS
# the defect a case banks). Linting it would make this repository's gate depend
# on that repository's house style and on its fixtures being valid Python,
# which they are not allowed to be.
# `campaign/generated/` is FCD-generated output (see its
# GENERATION.md); its file names and import order are the generator's, not ours.
extend-exclude = ["corpus", "campaign/generated"]

