[metadata]
name = engineering-assurance
version = 0.2.0
description = Private configuration-only engineering assurance module
long_description = file: README.md
long_description_content_type = text/markdown
license = AGPL-3.0-or-later
author = Agent IX
author_email = agents@agent-ix.dev
classifiers =
    Private :: Do Not Upload

[options]
packages = find:
python_requires = >=3.10
install_requires =
    PyYAML>=6.0,<7
    jsonschema>=4.23,<5
include_package_data = True

[options.package_data]
engineering_assurance =
    manifest.yaml
    schemas/*.json
    skeletons/*.md

[options.extras_require]
dev =
    pytest>=8.3,<10
    ruff>=0.11,<0.12
    wheel>=0.45,<1
