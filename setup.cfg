[metadata]
name = engineering-assurance
version = 0.2.0
description = Private configuration-only engineering assurance module
long_description = file: README.md
long_description_content_type = text/markdown
license = AGPL-3.0-or-later
author = Agent IX
author_email = agents@agent-ix.dev
classifiers =
    Private :: Do Not Upload

[options]
packages = find:
python_requires = >=3.10
install_requires =
    PyYAML>=6.0,<7
    jsonschema>=4.23,<5
include_package_data = True

[options.package_data]
engineering_assurance =
    INSTALL.md
    manifest.yaml
    schemas/*.json
    skeletons/*.md
    skills/assurance-onboarding/SKILL.md
    skills/assurance-onboarding/scripts/*.js
    skills/assurance-onboarding/workflows/*/*.yaml

[options.data_files]
.claude-plugin =
    .claude-plugin/plugin.json
.codex-plugin =
    .codex-plugin/plugin.json
.github/plugin =
    .github/plugin/plugin.json
. =
    opencode.json
pilots/assurance-workflows =
    pilots/assurance-workflows/README.md
    pilots/assurance-workflows/SKILL.md
pilots/assurance-workflows/scripts =
    pilots/assurance-workflows/scripts/invariants.js
pilots/assurance-workflows/workflows/assurance-intake =
    pilots/assurance-workflows/workflows/assurance-intake/def.yaml
pilots/assurance-workflows/workflows/architecture-evaluation =
    pilots/assurance-workflows/workflows/architecture-evaluation/def.yaml
pilots/assurance-workflows/workflows/measurement-promotion =
    pilots/assurance-workflows/workflows/measurement-promotion/def.yaml
pilots/assurance-workflows/workflows/change-assurance =
    pilots/assurance-workflows/workflows/change-assurance/def.yaml

[options.extras_require]
dev =
    pytest>=8.3,<10
    ruff>=0.11,<0.12
    setuptools>=77,<82
    wheel>=0.45,<1
