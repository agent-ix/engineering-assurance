[advisories]
unmaintained = "workspace"

[licenses]
confidence-threshold = 0.93
allow = [
  "AGPL-3.0-or-later",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Zlib",
]

[bans]
# "warn" because `full` carries the residue listed in the README ("Known
# duplicate crate versions"): `cap-std` and `jsonschema` subtrees. `make
# rust-deps` checks the empty-default graph only, so it does not see them; the
# guard that a graph a consumer resolves has no unlisted duplicate is
# `tests/duplicate_crates.rs`, which needs no cargo-deny.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/agent-ix/ix-trace-rs"]
