[advisories]
unmaintained = "workspace"

[licenses]
confidence-threshold = 0.93
allow = [
  "AGPL-3.0-or-later",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Zlib",
]

# Standing org exception (PLAT-853): ix-trace-rs is a first-party Agent-IX
# crate reached as a git dependency rather than crates.io; the `allow` list
# above stays permissive-only, so AGPL is admitted for this one dependency
# and cannot arrive unnoticed in another.
[[licenses.exceptions]]
crate = "ix-trace-rs"
allow = ["AGPL-3.0-or-later"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/agent-ix/ix-trace-rs"]
